<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopzilla</title>
    <link rel="shortcut icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQm9N5jR-dXQcNn2lyukWrkVw2nIgChCyu4OkTYEDFGP4L9uMf-uMmVjUkLfieKgZer9Pg&usqp=CAU" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Roboto:wght@300;400;500;700&family=Montserrat:wght@300;400;500;700&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="SignUp.css">
</head>
<body>
    
    <div id="header-container">
        <h1>Shopzilla</h1>
        <h4>The Greatest Platform for Shopping !!!</h4>
    </div>

    
    <div id="signUp-container">
        <div id="signUp-content">
            <div id="signUp">
                <h1>SignUp</h1>
            </div>
            <form id="signUp-form">
                <label for="email">Enter New Email:</label>
                <input type="email" id="email" name="email" required>
                <label for="password">Enter New Password:</label>
                <input type="password" id="password" name="password" required>
                <input type="submit" value="SignUp" id="signUp-button">
            </form>
        </div>

        <div id="signup-link">
            Already have an Account? <a href="./login.html">Login</a>
        </div>
    </div>

    
    <div id="footer-container">
        <p><i class="fa-regular fa-copyright"></i> 2024 All Rights Reserved. Designed By <span>Harshavardhan Latkar</span></p>
    </div>

    <script src="./SignUp.js"></script>
</body>
</html>
